services:
  app:
    build: .
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$APP_KEY" ]; then export APP_KEY="$$(php artisan key:generate --show)"; fi
        php artisan package:discover --ansi
        php artisan migrate --force
        (php artisan air-quality:collect || echo "Initial collection failed; serving existing local data.") &
        exec php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: airqapp
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
      AIR_QUALITY_API_URL: https://air-quality-api.open-meteo.com/v1/air-quality
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10

  scheduler:
    build: .
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: airqapp
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      LOG_CHANNEL: stderr
    depends_on:
      app:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airqapp
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
